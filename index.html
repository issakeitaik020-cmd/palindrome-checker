<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palindrome Checker</title>
<style>
body{font-family:Arial;background:#f0fdf4;padding:25px}
main{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}
input{width:100%;padding:13px;box-sizing:border-box;margin:15px 0}
button{padding:12px 18px;background:#16a34a;color:white;border:0;border-radius:7px;cursor:pointer}
#result{padding:15px;background:#dcfce7;margin-top:15px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Palindrome Checker</h1>
<p>Check whether a word or sentence reads the same backward.</p>
<input id="text" placeholder="Enter a word or sentence">
<button onclick="check()">Check Text</button>
<div id="result">Your result will appear here.</div>
</main>
<script>
function check(){
 const value=document.getElementById("text").value;
 const out=document.getElementById("result");
 if(!value.trim()){out.textContent="Please enter some text.";return;}
 const clean=value.toLowerCase().replace(/[^a-z0-9]/g,"");
 const reversed=[...clean].reverse().join("");
 out.textContent=clean===reversed
 ?'"'+value+'" is a palindrome.'
 :'"'+value+'" is not a palindrome.';
}
</script>
</body>
</html>
