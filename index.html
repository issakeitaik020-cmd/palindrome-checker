<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palindrome Checker</title>
<style>
body{font-family:Arial;background:#faf5ff;padding:25px}
main{max-width:550px;margin:40px auto;background:white;padding:30px;border-radius:16px}
textarea{width:100%;height:150px;padding:15px;box-sizing:border-box;border:1px solid #d8b4fe;border-radius:8px}
button{background:#9333ea;color:white;border:0;padding:13px 20px;border-radius:8px;cursor:pointer;margin-top:15px}
#result{background:#f3e8ff;padding:20px;border-radius:8px;margin-top:20px;font-size:20px}
</style>
</head>
<body>
<main>
<h1>Palindrome Checker</h1>
<p>Check whether a word reads the same forward and backward.</p>
<textarea id="text" placeholder="Enter a word or sentence..."></textarea>
<button onclick="check()">Check Palindrome</button>
<div id="result">Result: --</div>
</main>
<script>
function check(){
 const text=document.getElementById("text").value;
 const clean=text.toLowerCase().normalize("NFC").replace(/[^\p{L}\p{N}\p{M}]/gu,"");
 const out=document.getElementById("result");
 if(!clean){
  out.textContent="Please enter some text.";
  return;
 }
 const parts=Array.from(new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(clean),x=>x.segment);
 const reversed=parts.reverse().join("");
 const matching=clean===reversed;
 out.textContent=matching?"Yes! This is a palindrome.":"No, this is not a palindrome.";
 out.style.color=matching?"#15803d":"#dc2626";
}
</script>
</body>
</html>
